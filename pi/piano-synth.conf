# /etc/piano-synth.conf — настройки синтезатора.
# После правки:  sudo systemctl restart piano-synth piano-fx

# Звуковые банки (создаются scripts/make-soundfonts.sh)
PIANO_SF2=/opt/piano-synth/soundfonts/piano.sf2
MECH_SF2=/opt/piano-synth/soundfonts/mech.sf2

# Звуковой выход (aplay -l):  plughw:Headphones — штатный jack 3.5 мм,  hw:1 — первая USB-карта
ALSA_DEVICE=plughw:Headphones

# Общая громкость FluidSynth (0.2 — по умолчанию у FluidSynth; для этих банков 1.0, для моно-пресета small — 2.0)
GAIN=1.0

# Максимум одновременных голосов. Стерео-рояль + механика: 128 с запасом
POLYPHONY=128

# Буфер звука: размер периода и их число. Задержка ~ PERIOD_SIZE * PERIODS / 44100.
# Штатный jack Pi 3 сам округляет период до 444; USB-карта обычно тянет 64..128.
PERIOD_SIZE=256
PERIODS=3

# 0 — без реверберации (меньше нагрузка), 1 — включить
REVERB=0

# Параметры механики (см. README, раздел «Настройка механики»)
FX_ARGS="--hammer-boost 0 --hammer-exp 0.8 --random 1"
